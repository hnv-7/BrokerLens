name: Mobile Release

on:
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=brokerlens
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - run: flutter pub get

      - run: flutter build apk --release --split-per-abi

      - name: Rename APKs with version
        run: |
          VERSION="${GITHUB_REF_NAME#mobile-v}"
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            mv "$f" "BrokerLens-${VERSION}-${f#app-}"
          done
          ls -l

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BrokerLens Mobile ${{ github.ref_name }}
          generate_release_notes: true
          files: mobile/build/app/outputs/flutter-apk/BrokerLens-*.apk
